<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joy Das — Academic Research Webpage</title>
    <meta
      name="description"
      content="Personal academic research webpage of Joy Das — Prospective PhD applicant in Multimodal Learning, Natural Language Processing, and Trustworthy AI. B.Sc. in CSE, CUET."
    />
    <meta name="author" content="Joy Das" />

    <!-- Open Graph / Social Sharing Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Joy Das — Academic Research Webpage" />
    <meta
      property="og:description"
      content="Prospective PhD applicant focusing on Multimodal Learning, Natural Language Processing for low-resource languages, and Trustworthy AI."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Joy Das — Academic Research Webpage" />
    <meta
      name="twitter:description"
      content="Research in Multimodal Learning, NLP, and Trustworthy Machine Learning."
    />

    <!-- Favicon (relative path for GitHub Pages compatibility) -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />

    <!-- Subtle Academic Typography (with graceful system fallbacks) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,500;0,600;1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Top Navigation -->
    <header class="site-header">
      <nav class="nav-container" aria-label="Primary navigation">
        <a href="#home" class="site-brand" id="site-brand">Joy Das</a>
        <button
          type="button"
          class="nav-toggle"
          id="nav-toggle"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
          aria-controls="nav-links"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <ul class="nav-links" id="nav-links"></ul>
      </nav>
    </header>

    <!-- Two-Column Academic Layout -->
    <div class="page-shell">
      <aside class="profile-sidebar" id="profile-sidebar" aria-label="Author profile"></aside>

      <main class="main-content" id="main-content">
        <section class="content-section" id="home" aria-label="Introduction"></section>
        
        <section class="content-section" id="thesis" aria-labelledby="heading-thesis">
          <h2 class="section-heading" id="heading-thesis">Undergraduate Thesis</h2>
          <div id="thesis-content"></div>
        </section>
        
        <section class="content-section" id="experience" aria-labelledby="heading-experience">
          <h2 class="section-heading" id="heading-experience">Experience</h2>
          <div id="experience-list"></div>
        </section>

        <section class="content-section" id="projects" aria-labelledby="heading-projects">
          <h2 class="section-heading" id="heading-projects">Selected Projects</h2>
          <div class="project-list" id="projects-list"></div>
        </section>

        <section class="content-section" id="publications" aria-labelledby="heading-publications">
          <h2 class="section-heading" id="heading-publications">Publications</h2>
          <div class="pub-list" id="publications-list"></div>
        </section>

        <section class="content-section" id="education" aria-labelledby="heading-education">
          <h2 class="section-heading" id="heading-education">Education</h2>
          <div class="edu-list" id="education-list"></div>
        </section>

        <section class="content-section" id="skills" aria-labelledby="heading-skills">
          <h2 class="section-heading" id="heading-skills">Technical Skills</h2>
          <div class="skills-table" id="skills-list"></div>
        </section>

        <section class="content-section" id="achievements" aria-labelledby="heading-achievements">
          <h2 class="section-heading" id="heading-achievements">
            Awards, Certifications &amp; Service
          </h2>
          <div class="achievements-grid" id="achievements-list"></div>
        </section>
        <noscript>
          <section class="content-section">
            <h1>Joy Das — Academic Research Webpage</h1>
            <p>
              Please enable JavaScript to view the full interactive research profile, or download
              my CV directly: <a href="assets/cv/Joy_Das_CV.pdf">Download CV (PDF)</a>.
            </p>
            <p>Contact: <a href="mailto:joydas2004114@gmail.com">joydas2004114@gmail.com</a></p>
          </section>
        </noscript>
      </main>
    </div>

    <footer class="site-footer">
      <div class="footer-inner" id="footer-inner"></div>
    </footer>

    <!-- Centralized Content Configuration + Lightweight Renderer -->
    <script src="data/profile.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
